services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
  TYPO3\CMS\VisualEditor\:
    resource: '../Classes/*'

  TYPO3\CMS\Backend\Template\Components\Buttons\LanguageSelectorBuilder:
    public: true

  # GeneralUtility::makeInstance() takes the HiddenRestriction from the container, if it is public there.
  # The EditModeHiddenRestriction decorates it: it shows hidden content elements in edit mode and passes all
  # other tables to the decorated HiddenRestriction, so other decorations of it keep working.
  TYPO3\CMS\Core\Database\Query\Restriction\HiddenRestriction:
    public: true
    shared: false

  TYPO3\CMS\VisualEditor\Database\Query\Restriction\EditModeHiddenRestriction:
    decorates: TYPO3\CMS\Core\Database\Query\Restriction\HiddenRestriction
    public: true
    shared: false
    arguments:
      $hiddenRestriction: '@.inner'
